<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>멀티 자동화 확장</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      min-height: 500px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    .container {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #667eea;
      text-align: center;
    }
    
    .section {
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    
    .section:last-child {
      border-bottom: none;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #555;
    }
    
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background: #667eea;
      color: white;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }
    
    button:hover {
      background: #5568d3;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    .switch-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #667eea;
    }
    
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    
    .status {
      padding: 10px;
      background: #f0f0f0;
      border-radius: 5px;
      font-size: 12px;
      margin-top: 10px;
      max-height: 100px;
      overflow-y: auto;
    }
    
    .info {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 멀티 자동화 확장</h1>
    
    <!-- 자동화 기능 -->
    <div class="section">
      <div class="section-title">자동화 기능</div>
      <div class="button-group">
        <button id="autoFillBtn">폼 자동 작성</button>
        <button id="scrapeBtn">데이터 수집</button>
        <button id="comparePrice">가격 비교</button>
      </div>
    </div>
    
    <!-- 설정 -->
    <div class="section">
      <div class="section-title">설정</div>
      
      <div class="switch-container">
        <span>자동 번역</span>
        <label class="switch">
          <input type="checkbox" id="autoTranslate">
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="switch-container">
        <span>가격 추적</span>
        <label class="switch">
          <input type="checkbox" id="priceTracking" checked>
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="switch-container">
        <span>광고 차단</span>
        <label class="switch">
          <input type="checkbox" id="adBlock">
          <span class="slider"></span>
        </label>
      </div>
      
      <div class="switch-container">
        <span>알림</span>
        <label class="switch">
          <input type="checkbox" id="notifications" checked>
          <span class="slider"></span>
        </label>
      </div>
    </div>
    
    <!-- 도구 -->
    <div class="section">
      <div class="section-title">도구</div>
      <div class="button-group">
        <button id="translateBtn">페이지 번역</button>
        <button id="blockAdsBtn">광고 차단</button>
        <button id="viewDataBtn">수집 데이터 보기</button>
      </div>
    </div>
    
    <!-- 상태 -->
    <div class="section">
      <div class="section-title">상태</div>
      <div class="status" id="status">
        준비됨
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
